name: Sunrise Dental CI

on:
  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Service and Servlet tests
        run: mvn --batch-mode "-Dtest=*ServiceTest,*ServletTest" test

      - name: Build WAR package
        run: mvn --batch-mode -DskipTests package